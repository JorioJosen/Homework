<!DOCTYPE html>
    <html lang="vi">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale 1.0">
            <title>Bài tập 1</title>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
            <style>
                body{
                    background-color: #d6f4f5;
                }
                header{
                    background-color: #5d7b6f;
                    font-size: 1rem;
                    color: #eae7d6;
                    display: flex;
                    justify-content: space-around;
                }
                ul{
                    list-style: none;
                }
                a{
                    color: #eae7d6;
                    text-decoration: none;
                    font-size: 1.25rem;
                }
                a:hover{
                    color: #b0d4b8;
                    text-decoration: underline;
                }
                h2 {
                    font-size: 2.5rem;
                    color: #3c5248;
                }
                section{
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                }
                p{
                    font-weight: bold;
                    font-size: 1.25rem;
                    color: #3c5248;
                    text-align: right;
                    padding: 1rem;
                }
                form{
                    display: flex;
                    flex-direction: row;
                    justify-content: space-evenly;
                }
                fieldset{
                    background-color: #bbdac5;
                    display: flex;
                    flex-direction: column;
                    border: 0px;
                    width: 45%;
                    padding: 1rem;
                    margin-bottom: 1rem;
                }
                h3{
                    text-align: center;
                    font-size: 1.25rem;
                    font-weight: bold;
                    color: #3c5248;
                }
                button{
                    margin: 0 auto;
                }
                label{
                    display: flex;
                    align-items: center;
                    font-size: 1.25rem;
                    color: #3c5248;
                    padding-left: 1.75rem;
                }
                label:hover{
                    color: #05310f;
                    font-weight: bold;
                }
                input[type="checkbox"], input[type="radio"]{
                    margin-right: 1.5rem;
                    appearance: none;
                }
                input[type="checkbox"]::before, input[type="radio"]::before{
                    font-family: "Font Awesome 7 Free";
                    font-weight: 900;
                    font-size: 2rem;
                }
                input[type="checkbox"]::before{
                    content: "\f004";
                    font-weight: 300;
                    color: #a77985;
                }
                input[type="checkbox"]:checked::before{
                    content: "\f004";
                    font-weight: 900;
                    color: #bf3d64;
                }
                input[type="radio"]::before{
                    content: "\f204";
                    color: #a79985;
                }
                input[type="radio"]:checked::before{
                    content: "\f205";
                    color: #47983d;
                }
            </style>
        </head>
        <body>
            <header>
                <h1>52400186 - NguyenAnhHao</h1>
                <nav>
                    <ul>
                        <li><a href="https://www.facebook.com/share/1QBx7qqKvC/">My FaceBook</a></li>
                        <li><a href="https://github.com/JorioJosen">My GitHub</a></li>
                    </ul>
                </nav>
            </header>
            <main>
                <section>
                    <h2>Khảo sát sở thích</h2>
                    <p>Vui lòng chọn sở thích của bạn trong bài khảo sát dưới đây</p>
                </section>
                <section1>
                    <form>
                        <fieldset>
                            <h3>Chọn sở thích của bạn (có thể chọn nhiều)</h3>
                            <label><input type="checkbox" name="hobby[]" value="book">Đọc sách</label>
                            <label><input type="checkbox" name="hobby[]" value="music">Nghe nhạc</label>
                            <label><input type="checkbox" name="hobby[]" value="travel">Du lịch</label>
                            <label><input type="checkbox" name="hobby[]" value="sport">Thể thao</label>
                            <label><input type="checkbox" name="hobby[]" value="cooking">Nấu ăn</label>
                            <label><input type="checkbox" name="hobby[]" value="gaming">Chơi game</label>
                        </fieldset>
                        <fieldset>
                            <h3>Chọn giới tính</h3>
                            <label><input type="radio" name="gender" value="male">Nam</label>
                            <label><input type="radio" name="gender" value="female">Nữ</label>
                            <label><input type="radio" name="gender" value="other">Khác</label>
                        </fieldset>
                    </form>
                </section1>
            </main>
            <footer>
                <p>My Email: 52400186@student.tdtu.edu.vn</p>
            </footer>
        </body>
    </html>
